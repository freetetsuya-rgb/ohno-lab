<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研究紹介</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="site-nav"></nav>
<main id="main"></main>
<footer id="site-footer"></footer>
<script src="site.js"></script>
<script>
/* この研究者の内容。ここを編集してください */
const R1 = {
  name: "佐藤 花子",
  role: "博士課程 2年",
  affiliation: "〇〇大学 〇〇学部",
  photo: "",                       // 例: "images/yamada.jpg"
  keywords: ["キーワード1", "キーワード2", "キーワード3"],
  summary: [
    "研究の背景と目的を、専門外の人にも伝わる言葉で書きます。",
    { src: "images/fig1.png", caption: "", width: "360px" },   // 図1：文章の途中に入る画像（width で大きさを調整）
    "段落は自由に追加できます。",
    { src: "images/fig2.png", caption: "", width: "360px" }    // 図2：研究概要の最後に入る画像
  ],
  topics: [   // 研究テーマ（テーマ名のみ。説明を足すときは text: "..." を追加）
    { title: "ここに研究テーマを書きます" }
  ],
  challenges: [   // 研究で苦労したこと（文章。画像も summary と同じ書き方で入れられます）
    "研究を進める中で苦労したことと、それをどう乗り越えたかを書きます。",
    "失敗した経験や、そこから学んだことなども書くと、読む人の参考になります。"
  ],
  faq: [   // よくある質問（q: 質問, a: 答え。項目は自由に増減できます）
    { q: "配属前に勉強しておくことはありますか？", a: "ここに答えを書きます。" },
    { q: "研究室での1日の過ごし方を教えてください。", a: "ここに答えを書きます。" },
    { q: "研究のやりがいは何ですか？", a: "ここに答えを書きます。" }
  ],
  email: "name@example.ac.jp"
};
renderResearcher(R1);
</script>
<script>
/* 「研究で苦労したこと」「よくある質問」の表示（このHTMLだけで動くようにするための処理。通常は編集不要）
   site.js / style.css が新しい版で、すでに表示されている場合は何もしません */
(function () {
  var main = $("main"), join = main.querySelector("section.join");
  var has = function (t) { return [].some.call(main.querySelectorAll("h2"), function (h) { return h.textContent === t; }); };
  var sec = function (title, child) {
    var s = el("section", {}, [el("h2", { textContent: title }), child]);
    main.insertBefore(s, join);
  };
  if (R1.challenges && !has("研究で苦労したこと")) {
    sec("研究で苦労したこと", el("div", { className: "text" }, R1.challenges.map(function (t) { return el("p", { textContent: t }); })));
  }
  if (R1.faq && !has("よくある質問")) {
    document.head.append(el("style", { textContent:
      ".faq{max-width:52em;border-top:1px solid var(--line)}" +
      ".faq details{border-bottom:1px solid var(--line)}" +
      ".faq summary{cursor:pointer;list-style:none;padding:18px 36px 18px 0;position:relative;font-weight:500}" +
      ".faq summary::-webkit-details-marker{display:none}" +
      ".faq summary::before{content:'Q';font-family:var(--serif);font-weight:800;color:var(--accent);margin-right:14px}" +
      ".faq summary::after{content:'+';position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:22px}" +
      ".faq details[open] summary::after{content:'−'}" +
      ".faq p{position:relative;margin:0 0 20px;padding-left:28px;max-width:40em;color:var(--muted)}" +
      ".faq p::before{content:'A';position:absolute;left:0;font-family:var(--serif);font-weight:800;color:var(--muted)}" }));
    sec("よくある質問", el("div", { className: "faq" }, R1.faq.map(function (x) {
      return el("details", {}, [el("summary", { textContent: x.q }), el("p", { textContent: x.a })]);
    })));
  }
})();
</script>
</body>
</html>
